# Builds the gallery and publishes it to GitHub Pages.
#
# Photos are never committed: each run mirrors the Backblaze bucket into
# content/, lets Hugo derive thumbnails from it, and deploys only the
# derivatives. Both the originals and the generated sizes are cached between
# runs, so a build that finds nothing new in the bucket does almost no work.
name: Deploy

on:
  push:
    branches: [main]
  # Photos added to the bucket appear on the site at the next build.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.162.1
  B2_BUCKET: wedding-photos-joachim-sarah
  B2_PREFIX: photos/
  B2_ZIP_PREFIX: album

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      # Restored before the pull so only new photos are downloaded, and saved
      # afterwards under a key naming the exact set, so an unchanged album
      # reuses the existing entry instead of writing a new one.
      - name: Restore photos
        uses: actions/cache/restore@v4
        with:
          path: content
          key: photos-
          restore-keys: photos-

      - name: Restore generated image sizes
        uses: actions/cache/restore@v4
        with:
          path: resources
          key: hugo-resources-
          restore-keys: hugo-resources-

      # Single source of truth is hugo.toml, so the CDN is named once.
      - name: Read the CDN base from hugo.toml
        id: cdn
        run: echo "base=$(sed -n 's/^ *cdnBase *= *"\(.*\)"/\1/p' hugo.toml)" >> "$GITHUB_OUTPUT"

      - name: Count what the cache gave us
        id: restored
        run: echo "count=$(find content -type f -name '*.jpg' 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Pull photos from Backblaze
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_CDN_BASE: ${{ steps.cdn.outputs.base }}
        run: go run ./tools/b2 pull

      # Runs even when the pull failed part-way. Downloading a photo costs
      # Backblaze bandwidth against a daily cap, so a half-finished mirror is
      # worth keeping: the next attempt resumes instead of starting over.
      - name: Identify the album
        id: album
        if: always()
        run: |
          # Names the cache entries after the photos actually on disk.
          hash=$(find content -type f -name '*.jpg' -printf '%P %s\n' | sort | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "count=$(find content -type f -name '*.jpg' | wc -l)" >> "$GITHUB_OUTPUT"

      # Only when this run actually added photos. Restores match on the
      # `photos-` prefix and take the newest entry, so saving a set no larger
      # than the one we restored would shadow a better cache with a worse one.
      - name: Save photos
        if: ${{ always() && fromJSON(steps.album.outputs.count) > fromJSON(steps.restored.outputs.count) }}
        uses: actions/cache/save@v4
        with:
          path: content
          key: photos-${{ steps.album.outputs.hash }}

      - name: Build the download-everything archive
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        run: go run ./tools/b2 zip

      # The download buttons are the only thing pointing at the CDN, and a
      # hostname that does not resolve yet would make them dead links. Ask it
      # for a photo we know exists; if it cannot serve one, this build links
      # straight to Backblaze instead and the next build tries again.
      - name: Check whether the CDN is serving
        id: cdnlive
        run: |
          base="${{ steps.cdn.outputs.base }}"
          first=$(find content -type f -name '*.jpg' -printf '%P\n' | sort | head -1)
          if [ -n "$base" ] && [ -n "$first" ] \
             && curl -fsS -I --max-time 15 "$base/$B2_PREFIX$first" > /dev/null; then
            echo "serving from $base"
            echo "base=$base" >> "$GITHUB_OUTPUT"
          else
            echo "not serving yet - downloads will point at Backblaze"
            echo "base=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build site
        env:
          # Overrides params.b2.cdnBase; empty means fall back to publicBase.
          HUGO_PARAMS_B2_CDNBASE: ${{ steps.cdnlive.outputs.base }}
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Save generated image sizes
        uses: actions/cache/save@v4
        with:
          path: resources
          key: hugo-resources-${{ steps.album.outputs.hash }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
